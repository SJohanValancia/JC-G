<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC-G - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background">
            <div class="cow-silhouette">🐄</div>
            <div class="fence-pattern"></div>
        </div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-icon">🐄</span>
                    <h1>JC-G</h1>
                </div>
                <p class="subtitle">Sistema de Gestión Ganadera Profesional</p>
            </div>

            <!-- Solo Formulario de Login -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginUsuario">
                        <span class="label-icon">👤</span>
                        Nombre de Usuario
                    </label>
                    <input 
                        type="text" 
                        id="loginUsuario" 
                        name="nombreUsuario"
                        placeholder="juanperez"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <span class="label-icon">🔒</span>
                        Contraseña
                    </label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div id="loginError" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-primary">
                    <span class="btn-text">Ingresar al Sistema</span>
                    <span class="btn-loader" style="display: none;">⏳ Procesando...</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>
                </p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
